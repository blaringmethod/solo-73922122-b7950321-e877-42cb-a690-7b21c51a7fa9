services:
  qc-review:
    build: .
    image: pe-fragment-qc:1.0.0
    ports:
      - "8000:8000"
    environment:
      # Request caps from the delivery specification (defaults in app/config.py
      # already match; exposed here for operational overrides).
      QC_MAX_PAIRS: "2000"
      QC_MAX_READ_LENGTH: "500"
      QC_MAX_CANDIDATES_PER_END: "3"
      QC_MIN_CALIBRATION_PAIRS: "20"
    mem_limit: 256m
    mem_reservation: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
